name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Metro's compiler plugin requires the Gradle daemon on JDK 21+.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 22

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK platform 37
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37"

      - name: Unit tests (all modules, Robolectric suites included)
        run: ./gradlew test

      - name: Assemble samples and publishable artifacts
        run: ./gradlew assembleDebug publishToMavenLocal -x test

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/'
